name: Desplegar en bookingly.cloud

# Cada push a main: se verifica, y si pasa todo se despliega en el servidor.
# El bootstrap inicial va aparte, en bootstrap.yml.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".gitattributes"
  workflow_dispatch:

concurrency:
  group: servidor-produccion
  cancel-in-progress: false

jobs:
  verificar:
    name: Comprobaciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npx tsc --noEmit

      - name: Tests de los helpers
        run: npx tsx scripts/selftest.ts

      - name: Compilacion
        run: npm run build
        env:
          SITE_URL: https://bookingly.cloud

  desplegar:
    name: Desplegar por SSH
    needs: verificar
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Comprobar que hay credenciales SSH
        env:
          KEY: ${{ secrets.SSH_KEY }}
          PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          if [ -z "$KEY" ] && [ -z "$PASS" ]; then
            echo "::error::Define el secreto SSH_KEY o SSH_PASSWORD en el repositorio."
            exit 1
          fi

      - name: Ejecutar deploy.sh en el servidor
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: bash /opt/bookingly.cloud/deploy/deploy.sh

      - name: Comprobar que el sitio sigue en pie
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://bookingly.cloud/ || echo 000)
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "::error::El sitio no responde con 200."; exit 1; }
